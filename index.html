<!DOCTYPE html>
<html lang="ur">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Gateway</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #121214;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .payment-card {
            background-color: #1e1e24;
            border-radius: 16px;
            padding: 24px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border: 1px solid #2a2a32;
        }

        h2 {
            text-align: center;
            margin-bottom: 20px;
            font-size: 22px;
        }

        .method-selector {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .method-btn {
            flex: 1;
            padding: 12px;
            border: 1px solid #3a3a46;
            background: #25252e;
            color: #fff;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
        }

        .method-btn.active {
            background: #f0b90b;
            color: #000;
            border-color: #f0b90b;
        }

        .network-selector {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .network-btn {
            flex: 1;
            padding: 10px;
            border: 1px solid #3a3a46;
            background: #1e1e24;
            color: #aaa;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
        }

        .network-btn.active {
            border-color: #f0b90b;
            color: #fff;
            background: #25252e;
        }

        .qr-container {
            text-align: center;
            background: #ffffff;
            padding: 15px;
            border-radius: 12px;
            margin: 15px 0;
            display: flex;
            justify-content: center;
        }

        .qr-container img {
            width: 200px;
            height: 200px;
            object-fit: contain;
        }

        .address-box {
            background: #141418;
            border: 1px solid #2a2a32;
            border-radius: 8px;
            padding: 12px;
            margin-top: 15px;
        }

        .address-label {
            font-size: 12px;
            color: #888;
            margin-bottom: 5px;
        }

        .address-value {
            font-size: 13px;
            word-break: break-all;
            color: #2ed573;
            margin-bottom: 10px;
            font-family: monospace;
        }

        .copy-btn {
            width: 100%;
            padding: 10px;
            background: #25252e;
            border: 1px solid #3a3a46;
            color: #fff;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 500;
        }

        .copy-btn:hover {
            background: #32323e;
        }

        .hidden {
            display: none !important;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: #aaa;
            margin-top: 10px;
        }
    </style>
</head>
<body>

<div class="payment-card">
    <h2>Deposit Options</h2>

    <!-- Step 1: Select Main Payment Method -->
    <div class="method-selector">
        <button class="method-btn active" onclick="selectMethod('crypto')">Crypto (USDT)</button>
        <button class="method-btn" onclick="selectMethod('pkr')">PKR Payment</button>
    </div>

    <!-- Crypto Content -->
    <div id="crypto-section">
        <div class="network-selector">
            <button class="network-btn active" id="btn-trc20" onclick="selectCryptoNetwork('trc20')">TRC20 (Tron)</button>
            <button class="network-btn" id="btn-bep20" onclick="selectCryptoNetwork('bep20')">BEP20 (BSC)</button>
        </div>

        <div class="qr-container">
            <img id="crypto-qr" src="" alt="Crypto QR Code">
        </div>

        <div class="address-box">
            <div class="address-label">Deposit Address</div>
            <div class="address-value" id="crypto-address">---</div>
            <button class="copy-btn" onclick="copyAddress()">Copy Address</button>
        </div>

        <div class="info-row">
            <span>Minimum Deposit:</span>
            <span style="color:#fff">0.01 USDT</span>
        </div>
    </div>

    <!-- PKR Content -->
    <div id="pkr-section" class="hidden">
        <div class="qr-container">
            <!-- Replace 'pkr_qr.jpg' with your actual image path -->
            <img id="pkr-qr" src="https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=PKR_PAYMENT_SCANNER" alt="PKR Scanner QR">
        </div>
        <div class="address-box" style="text-align: center;">
            <div class="address-label">Scan QR Code using JazzCash / EasyPaisa / Bank App</div>
        </div>
    </div>
</div>

<script>
    // Addresses
    const addresses = {
        trc20: "TAaTmYha48Pbft4aJn1RGyKmVoQZKuLArM",
        bep20: "0x92bd605f7a49113e356a0aa4f1ae992f6506c19f"
    };

    let currentNetwork = 'trc20';

    function updateCryptoDisplay() {
        const address = addresses[currentNetwork];
        document.getElementById('crypto-address').innerText = address;
        // Dynamic QR code generation based on address
        document.getElementById('crypto-qr').src = `https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=${address}`;
    }

    function selectMethod(method) {
        const buttons = document.querySelectorAll('.method-btn');
        buttons.forEach(btn => btn.classList.remove('active'));

        if (method === 'crypto') {
            buttons[0].classList.add('active');
            document.getElementById('crypto-section').classList.remove('hidden');
            document.getElementById('pkr-section').classList.add('hidden');
        } else {
            buttons[1].classList.add('active');
            document.getElementById('crypto-section').classList.add('hidden');
            document.getElementById('pkr-section').classList.remove('hidden');
        }
    }

    function selectCryptoNetwork(network) {
        currentNetwork = network;
        document.getElementById('btn-trc20').classList.toggle('active', network === 'trc20');
        document.getElementById('btn-bep20').classList.toggle('active', network === 'bep20');
        updateCryptoDisplay();
    }

    function copyAddress() {
        const addressText = document.getElementById('crypto-address').innerText;
        navigator.clipboard.writeText(addressText).then(() => {
            alert("Address copied to clipboard!");
        });
    }

    // Initialize default view
    updateCryptoDisplay();
</script>

</body>
</html>
